services:
  db:
    image: postgres:16-alpine
    container_name: spam_email_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_spam_classification
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # DB only used inside Docker network — no host port to avoid 5432 conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d email_spam_classification"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spam_email_app
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/email_spam_classification
      MODEL_DIR: /app/saved_models
      FLASK_ENV: development
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      SEED_DATASET: "true"
    volumes:
      - ./saved_models:/app/saved_models
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
