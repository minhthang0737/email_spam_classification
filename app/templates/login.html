{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <section class="card card-body">
            <h1 class="h4 mb-3">Đăng nhập hệ thống</h1>
            <p class="text-muted">Dành cho người quản trị và người gắn nhãn email.</p>
            <form method="post">
                <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                <div class="form-group"><label for="username">Tên đăng nhập</label><input class="form-control" id="username" name="username" autocomplete="username" required></div>
                <div class="form-group"><label for="password">Mật khẩu</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
                <button class="btn btn-primary" type="submit">Đăng nhập</button>
            </form>
        </section>
    </div>
</div>
{% endblock %}
